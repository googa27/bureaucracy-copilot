name: Portfolio Architecture

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Validate portfolio architecture contract
        run: python scripts/check_portfolio_architecture.py
      - name: Install optional causal-impact profile
        run: python -m pip install -e '.[impact]' pytest
      - name: Report causal-impact dependency versions
        run: python -c "import numpy, pandas, statsmodels; print(f'numpy={numpy.__version__} pandas={pandas.__version__} statsmodels={statsmodels.__version__}')"
      - name: Run causal-impact integration tests
        run: python -m pytest -q tests/integration/test_impact_evaluation.py

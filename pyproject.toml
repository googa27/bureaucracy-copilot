[project]
name = "bureaucracy-copilot"
version = "0.1.0"
description = "Private bureaucracy automation assistant with guarded Gmail and Calendar mutations."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "google-api-python-client>=2.0.0",
  "google-auth>=2.0.0",
  "google-auth-oauthlib>=1.0.0",
  "jsonschema>=4.19.0",
  "click>=8.1.7",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
]

[project.scripts]
bureaucracy-copilot = "src.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
